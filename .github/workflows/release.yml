name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build py-init.skill
        run: |
          mkdir -p build/py-init
          cp SKILL.md build/py-init/
          cp -r assets build/py-init/assets
          cp -r references build/py-init/references
          cd build
          zip -r py-init.skill py-init

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/py-init.skill \
            --title "${{ github.ref_name }}" \
            --generate-notes
